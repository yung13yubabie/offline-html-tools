name: Offline browser smoke
on:
  workflow_dispatch:
  push:
    paths: ['apps/**', 'tests/**', 'feedback/**', 'ci/**', '.github/workflows/browser-smoke.yml']
  pull_request:
    paths: ['apps/**', 'tests/**', 'feedback/**', 'ci/**', '.github/workflows/browser-smoke.yml']
permissions:
  contents: read
jobs:
  chromium-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every pure regression suite
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests/*.cjs; do
            if [[ "$suite" != "tests/browser-smoke.cjs" ]]; then
              node "$suite"
            fi
          done
          node feedback/test-static.cjs
      # Published version verified at https://registry.npmjs.org/playwright/1.62.1 (2026-10-30).
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install PDF verification utilities
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Run synthetic offline file tests
        run: node tests/browser-smoke.cjs
      - name: Retain synthetic screenshots and exact test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-results
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 14
