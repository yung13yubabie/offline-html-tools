name: Intranet folder navigation check
on:
  push:
    branches: ['codex/intranet-folder-check']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install chromium
      - run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const { resolve } = require('node:path');
          const { pathToFileURL } = require('node:url');
          (async () => {
            const browser = await chromium.launch({headless:true,channel:"chromium"});
            try { await require('./tests/intranet-file-finder.browser.js')(browser, pathToFileURL(resolve('apps/intranet-file-finder.html')).href); }
            finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
