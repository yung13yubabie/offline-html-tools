<section id="allocationPanel" class="panel" data-review-id="accounting-calculator-allocationPanel" data-review-name="跨年跨月金額分攤">
  <div class="workspace-heading">
    <div><h1>金額分攤</h1><p>依實際天數按年或按月分攤，起日與迄日都計入。</p></div>
  </div>
  <div class="allocation-layout19">
    <section class="allocation-card19 allocation-input19" aria-labelledby="allocationInputTitle19" data-review-id="accounting-calculator-allocationInput" data-review-name="分攤條件">
      <div class="allocation-heading19"><h2 id="allocationInputTitle19">分攤條件</h2></div>
      <form id="allocationForm19" novalidate>
        <p class="allocation-date-hint19" id="allocationDateHint19">日期可手打或貼上，例如 2026/9/1、2026-09-01 或 20260901。</p>
        <div class="allocation-fields19">
          <div class="allocation-field19">
            <label for="allocationStart19">起始日期</label>
            <div class="allocation-date-control19">
              <input id="allocationStart19" type="text" maxlength="14" placeholder="YYYY/MM/DD" autocomplete="off" spellcheck="false" aria-describedby="allocationDateHint19 allocationStartError19" required>
              <button class="btn allocation-picker-button19" type="button" id="allocationStartPickerButton19" aria-label="用日曆選擇起始日期" aria-controls="allocationStartPicker19">日曆</button>
              <input id="allocationStartPicker19" class="allocation-native-picker19" type="date" min="0001-01-01" max="9999-12-31" aria-label="起始日期日曆" aria-hidden="true" tabindex="-1">
            </div>
            <span class="allocation-error19" id="allocationStartError19" hidden></span>
          </div>
          <div class="allocation-field19">
            <label for="allocationEnd19">結束日期</label>
            <div class="allocation-date-control19">
              <input id="allocationEnd19" type="text" maxlength="14" placeholder="YYYY/MM/DD" autocomplete="off" spellcheck="false" aria-describedby="allocationDateHint19 allocationEndError19" required>
              <button class="btn allocation-picker-button19" type="button" id="allocationEndPickerButton19" aria-label="用日曆選擇結束日期" aria-controls="allocationEndPicker19">日曆</button>
              <input id="allocationEndPicker19" class="allocation-native-picker19" type="date" min="0001-01-01" max="9999-12-31" aria-label="結束日期日曆" aria-hidden="true" tabindex="-1">
            </div>
            <span class="allocation-error19" id="allocationEndError19" hidden></span>
          </div>
          <label class="allocation-field19" for="allocationAmount19">
            整段總金額
            <input id="allocationAmount19" type="text" inputmode="decimal" maxlength="30" placeholder="例如 1,000" autocomplete="off" aria-describedby="allocationAmountError19" required>
            <span class="allocation-error19" id="allocationAmountError19" hidden></span>
          </label>
          <label class="allocation-field19" for="allocationUnit19">
            分組方式
            <select id="allocationUnit19" aria-describedby="allocationUnitError19"><option value="year">按年</option><option value="month">按月</option></select>
            <span class="allocation-error19" id="allocationUnitError19" hidden></span>
          </label>
        </div>
      </form>
      <details class="allocation-help19"><summary>計算與尾差規則</summary><p>各組先取整數分，再把剩餘分配給餘數較大的組，平手依日期先後，確保合計等於總金額。負數依相同規則分配後還原負號。</p><p>日期支援西元 0001–9999。金額可填 0、負數與正確千分位，最多兩位小數及 999,999,999,999.99。</p></details>
    </section>
    <section class="allocation-card19 allocation-output19" aria-labelledby="allocationOutputTitle19" data-review-id="accounting-calculator-allocationOutput" data-review-name="分攤算式與輸出">
      <div class="allocation-heading19"><h2 id="allocationOutputTitle19">分攤明細</h2><button id="allocationCopy19" class="btn" type="button" disabled>複製文字</button></div>
      <fieldset class="allocation-options19"><legend>算式與複製內容</legend><label><input id="allocationShowAmount19" type="checkbox" checked>總金額</label><label><input id="allocationShowRatio19" type="checkbox" checked>天數比例</label><label><input id="allocationShowDates19" type="checkbox">複製含日期</label><label><input id="allocationShowResult19" type="checkbox">結果</label></fieldset>
      <div id="allocationSummary19" class="allocation-summary19" hidden></div>
      <div id="allocationResult19" class="allocation-result19" data-state="empty"><p class="allocation-empty19">填好日期及總金額後會自動分攤。</p></div>
      <p id="allocationLive19" class="allocation-visually-hidden19" role="status"></p>
      <nav id="allocationPager19" class="allocation-pager19" aria-label="分攤明細分頁" hidden><button id="allocationPrev19" class="btn" type="button">上一頁</button><span id="allocationPageLabel19"></span><button id="allocationNext19" class="btn" type="button">下一頁</button></nav>
      <p id="allocationCopyStatus19" class="allocation-copy-status19" role="status" aria-live="polite"></p>
      <div id="allocationFallbackWrap19" hidden><label for="allocationCopyFallback19">輸出文字</label><textarea id="allocationCopyFallback19" readonly aria-describedby="allocationCopyStatus19"></textarea></div>
    </section>
  </div>
</section>
